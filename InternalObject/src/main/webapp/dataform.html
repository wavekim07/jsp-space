<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Data Form</title>
</head>
<body>
	<h1>HTML Form</h1>
	<form action="dataproc.jsp" method="get">
		<table>
			<tr>
				<td>이름 : </td>
				<td>
					<input type="text" name="uname" placeholder="이름" />
				</td>
			</tr>
			<tr>
				<td>생년월일 : </td>
				<td>
					<input type="date" name="birth"/>
				</td>
			</tr>
			<tr>
				<td>취미 : </td>
				<td>
					<input type="checkbox" name="hobby" value="reading"/>독서 <br>
					<input type="checkbox" name="hobby" value="swimming"/>수영 <br>
					<input type="checkbox" name="hobby" value="cycling"/>싸이클링 <br>
				</td>
			</tr>
			<tr>
				<td>수준 : </td>
				<td>
					<input type="radio" name="skill" value="s1" checked />Beginner <br>
					<input type="radio" name="skill" value="s2"/>Intermediate <br>
					<input type="radio" name="skill" value="s3"/>Advanced <br>
				</td>
			</tr>
			<tr>
				<td colspan="2">
					<input type="submit" value="보내기" />
				</td>
			</tr>
		</table>
	</form>
</body>
</html>
